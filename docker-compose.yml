services:
  backend:
    build:
      context: ./backend
    container_name: smartestate-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-smartestate-docker-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SMARTESTATE_USE_MANAGED_SERVICES: ${SMARTESTATE_USE_MANAGED_SERVICES:-false}
      DATABASE_FALLBACK_TO_SQLITE: ${DATABASE_FALLBACK_TO_SQLITE:-false}
      DATABASE_SSL_REQUIRE: ${DATABASE_SSL_REQUIRE:-false}
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-600}
      DATABASE_URL: ${DATABASE_URL:-postgres://smartestate:smartestate@postgres:5432/smartestate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/smartestate}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-5000}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: smartestate-frontend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    working_dir: /app
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-SmartEstate}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: smartestate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartestate
      POSTGRES_USER: smartestate
      POSTGRES_PASSWORD: smartestate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartestate -d smartestate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartestate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: smartestate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
  mongo_data:
